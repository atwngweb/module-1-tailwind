<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatein</title>
    <link rel="stylesheet" href="./styles/build.css">
</head>

<body>
    <!-- Top Header -->
    <div
        class="h-15.75 bg-[url(../image/top-header.png)] text-white text-[18px] font-medium flex justify-center items-center relative border-b border-[#2A2A2A]">
        <div class="flex gap-2.5">
            <p>✨Discover Your Dream Property with Estatein</p>
            <a href="#" class="underline">Learn More</a>
        </div>
        <div
            class="cursor-pointer absolute right-5 w-8 h-8 bg-[#303030] rounded-[100%] flex justify-center items-center">
            <img src="./image/icon-close.svg" class="w-3 h-3" alt="close">
        </div>
    </div>
    <!-- Main Header -->
    <header class="h-24.75 bg-[#191919] flex items-center">
        <div class="w-[1596px] mx-auto flex items-center text-white text-[18px] ">
            <!-- Logo -->
            <a href="#">
                <img src="./image/logo-full.svg" alt="logo">
            </a>
            <!-- Nav -->
            <ul class="flex flex-1 justify-center items-center font-medium">
                <li><a href="#"
                        class="px-5 py-3 border border-transparent hover:rounded-xl hover:border hover:border-[#2a2a2a] hover:bg-[#141414]">Home</a>
                </li>
                <li><a href="#"
                        class="px-5 py-3 border border-transparent hover:rounded-xl hover:border hover:border-[#2a2a2a] hover:bg-[#141414]">About
                        Us</a></li>
                <li><a href="#"
                        class="px-5 py-3 border border-transparent hover:rounded-xl hover:border hover:border-[#2a2a2a] hover:bg-[#141414]">Properties</a>
                </li>
                <li><a href="#"
                        class="px-5 py-3 border border-transparent hover:rounded-xl hover:border hover:border-[#2a2a2a] hover:bg-[#141414]">Services</a>
                </li>
            </ul>
            <!-- Contact -->
            <a href="#" class="ml-auto font-medium px-5 py-3 rounded-xl border border-[#2a2a2a] bg-[#141414]">Contact
                Us</a>

        </div>
    </header>

</body>

</html>
